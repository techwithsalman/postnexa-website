<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <filter id="cal-shadow" x="-10" y="0" width="620" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base Window -->
  <g filter="url(#cal-shadow)">
    <rect x="20" y="20" width="560" height="450" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Header -->
    <rect x="20" y="20" width="560" height="60" rx="16" fill="#FFF9F5"/>
    <line x1="20" y1="80" x2="580" y2="80" stroke="#FBD5B5"/>

    <!-- Title & Navigation -->
    <circle cx="50" cy="50" r="14" fill="#F16A21" opacity="0.1"/>
    <path d="M46 45L51 50L46 55" stroke="#F16A21" stroke-width="2" stroke-linecap="round"/>
    <text x="75" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1F2937">Interactive Calendar</text>

    <rect x="360" y="36" width="100" height="28" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="375" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4B5563">Grid View</text>
    <rect x="470" y="36" width="90" height="28" rx="6" fill="#F16A21"/>
    <text x="485" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">+ Add Post</text>

    <!-- Calendar Matrix Preview -->
    <g transform="translate(40, 100)">
      <!-- Day Columns -->
      <!-- Mon -->
      <rect x="0" y="0" width="160" height="340" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="12" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6B7280">Mon, Oct 19</text>
      <!-- Mon Post 1 -->
      <rect x="10" y="40" width="140" height="85" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="18" y="48" width="6" height="6" rx="2" fill="#1877F2"/>
      <text x="28" y="54" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1F2937">Product Demo Reel</text>
      <text x="18" y="72" font-family="system-ui, sans-serif" font-size="8.5" fill="#6B7280">Facebook &amp; IG</text>
      <rect x="18" y="90" width="55" height="18" rx="4" fill="#DEF7EC"/>
      <text x="24" y="102" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#03543F">Published ✓</text>

      <!-- Mon Post 2 -->
      <rect x="10" y="135" width="140" height="85" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="18" y="143" width="6" height="6" rx="2" fill="#0A66C2"/>
      <text x="28" y="149" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1F2937">Hiring Update</text>
      <text x="18" y="167" font-family="system-ui, sans-serif" font-size="8.5" fill="#6B7280">LinkedIn Global</text>
      <rect x="18" y="185" width="55" height="18" rx="4" fill="#DEF7EC"/>
      <text x="24" y="197" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#03543F">Published ✓</text>

      <!-- Tue (Active Drag-and-Drop) -->
      <rect x="180" y="0" width="160" height="340" rx="8" fill="#FFF9F5" stroke="#F16A21" stroke-width="1.5"/>
      <text x="192" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#F16A21">Tue, Oct 20 (Target)</text>
      
      <!-- Drag Target Zone -->
      <rect x="190" y="40" width="140" height="110" rx="8" fill="#FFF" stroke="#F16A21" stroke-dasharray="4 4" stroke-width="1.5"/>
      <circle cx="260" cy="80" r="16" fill="#FCEFE6"/>
      <path d="M256 80L264 80M260 76L260 84" stroke="#F16A21" stroke-width="2" stroke-linecap="round"/>
      <text x="215" y="115" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#F16A21">Drop here to reschedule</text>

      <!-- Floating Card being dragged -->
      <g transform="translate(190, 165)" filter="url(#cal-shadow)">
        <rect width="140" height="95" rx="8" fill="#FFFFFF" stroke="#F16A21" stroke-width="2"/>
        <rect x="10" y="10" width="8" height="8" rx="2" fill="#E1306C"/>
        <text x="24" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#111827">Summer Sale Promo ☀️</text>
        <rect x="10" y="28" width="120" height="35" rx="4" fill="#FCEFE6"/>
        <text x="16" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#F16A21">Auto-adapts to IG &amp; FB</text>
        <rect x="10" y="70" width="70" height="16" rx="4" fill="#FEE2E2"/>
        <text x="16" y="81" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#991B1B">Drag &amp; Drop</text>
      </g>

      <!-- Wed -->
      <rect x="360" y="0" width="160" height="340" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="372" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6B7280">Wed, Oct 21</text>
      <rect x="370" y="40" width="140" height="85" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="378" y="48" width="6" height="6" rx="2" fill="#000000"/>
      <text x="388" y="54" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1F2937">Behind The Scenes</text>
      <text x="378" y="72" font-family="system-ui, sans-serif" font-size="8.5" fill="#6B7280">TikTok &amp; Reels</text>
      <rect x="378" y="90" width="65" height="18" rx="4" fill="#E0F2FE"/>
      <text x="384" y="102" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#0369A1">Auto Queue</text>
    </g>

    <!-- Cursor Pointer -->
    <g transform="translate(340, 260)">
      <polygon points="0,0 12,28 18,18 28,12" fill="#212121"/>
      <circle cx="12" cy="12" r="3" fill="#FFF"/>
    </g>
  </g>
</svg>
