<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <filter id="ana-shadow" x="-10" y="0" width="620" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F16A21" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F16A21" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <g filter="url(#ana-shadow)">
    <rect x="20" y="20" width="560" height="450" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="20" y="20" width="560" height="55" rx="16" fill="#FFF9F5"/>
    <text x="45" y="52" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1F2937">Cross-Platform Analytics &amp; GA4</text>
    
    <rect x="420" y="32" width="140" height="30" rx="6" fill="#F16A21"/>
    <text x="432" y="51" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FFF">Export White-Label PDF</text>

    <!-- Top KPI Cards -->
    <g transform="translate(45, 90)">
      <!-- KPI 1 -->
      <rect width="155" height="75" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6B7280">Total Impressions</text>
      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#111827">1,482,900</text>
      <text x="12" y="66" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#10B981">↑ +38.4% vs last mo</text>

      <!-- KPI 2 -->
      <rect x="170" width="155" height="75" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="182" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6B7280">Engagement Rate</text>
      <text x="182" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#111827">5.82%</text>
      <text x="182" y="66" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#10B981">↑ +14.2% Industry Avg</text>

      <!-- KPI 3 -->
      <rect x="340" width="165" height="75" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="352" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6B7280">Conversions (GA4)</text>
      <text x="352" y="48" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#111827">3,490 Leads</text>
      <text x="352" y="66" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#10B981">↑ $142,500 Revenue</text>
    </g>

    <!-- Main Chart Section -->
    <g transform="translate(45, 180)">
      <rect width="505" height="175" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">Audience Growth &amp; Content ROI</text>
      
      <!-- Chart Area -->
      <g transform="translate(16, 40)">
        <line x1="0" y1="90" x2="470" y2="90" stroke="#F3F4F6"/>
        <line x1="0" y1="60" x2="470" y2="60" stroke="#F3F4F6"/>
        <line x1="0" y1="30" x2="470" y2="30" stroke="#F3F4F6"/>
        <line x1="0" y1="0" x2="470" y2="0" stroke="#F3F4F6"/>

        <!-- Area Curve -->
        <path d="M0 80 Q 80 70, 140 45 T 280 30 T 400 15 L 470 5 L 470 90 L 0 90 Z" fill="url(#chart-fill)"/>
        <path d="M0 80 Q 80 70, 140 45 T 280 30 T 400 15 L 470 5" stroke="#F16A21" stroke-width="3" fill="none"/>
        
        <!-- Competitor line -->
        <path d="M0 85 Q 90 80, 180 70 T 360 65 L 470 60" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
        
        <!-- Dot highlight -->
        <circle cx="280" cy="30" r="5" fill="#F16A21"/>
        <circle cx="280" cy="30" r="9" stroke="#F16A21" stroke-width="2" fill="none" opacity="0.4"/>
      </g>
      <text x="350" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F16A21">— Your Brand</text>
      <text x="430" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#9CA3AF">--- Competitor Avg</text>
    </g>

    <!-- Bottom Competitor & White Label Strip -->
    <g transform="translate(45, 370)">
      <rect width="245" height="75" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#111827">Competitor Benchmarking</text>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="9.5" fill="#6B7280">Outperforming 8/10 rivals in engagement rate &amp; video views.</text>
      <text x="14" y="62" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#F16A21">View Competitor Radar →</text>

      <rect x="260" width="245" height="75" rx="8" fill="#FFF9F5" stroke="#FBD5B5"/>
      <text x="274" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#111827">White-Label Client Portal</text>
      <text x="274" y="44" font-family="system-ui, sans-serif" font-size="9.5" fill="#6B7280">Branded with your agency's logo, colors, custom domain &amp; summary.</text>
      <text x="274" y="62" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#10B981">Live Client URL Active ✓</text>
    </g>
  </g>
</svg>
