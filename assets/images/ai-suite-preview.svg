<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <filter id="ai-card-shadow" x="-10" y="0" width="520" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F16A21" flood-opacity="0.1"/>
    </filter>
  </defs>
  <g filter="url(#ai-card-shadow)">
    <rect x="20" y="20" width="460" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="20" y="20" width="460" height="50" rx="16" fill="#FFF8F3"/>
    <circle cx="45" cy="45" r="10" fill="#F16A21"/>
    <text x="62" y="49" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#212121">Champ AI Studio</text>
    <rect x="360" y="32" width="105" height="26" rx="13" fill="#FAE048"/>
    <text x="375" y="49" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#212121">GPT-4o Vision</text>

    <!-- Prompt Area -->
    <rect x="40" y="85" width="420" height="55" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="52" y="108" font-family="system-ui, sans-serif" font-size="10.5" fill="#111827">"Create a 3-part carousel on 2026 SaaS Growth Tactics for agencies..."</text>
    <text x="52" y="126" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">Tone: Authoritative &amp; Engaging • Length: Medium</text>

    <!-- Generated Content Cards -->
    <g transform="translate(40, 155)">
      <rect width="420" height="150" rx="10" fill="#FFF9F5" stroke="#FBD5B5"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#F16A21">✨ AI Generated Variations (3 options)</text>
      
      <!-- Option 1 -->
      <rect x="14" y="36" width="392" height="48" rx="6" fill="#FFF" stroke="#E5E7EB"/>
      <text x="24" y="54" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#1F2937">Option 1: "Scaling an agency from 5 to 50 clients requires 1 key shift..."</text>
      <text x="24" y="70" font-family="system-ui, sans-serif" font-size="8.5" fill="#F16A21">#AgencyGrowth #B2BStrategy #MarketingAutomation</text>

      <!-- Hashtag selector -->
      <g transform="translate(14, 94)">
        <rect width="90" height="22" rx="4" fill="#FCEFE6"/>
        <text x="8" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F16A21">#SocialMedia (98% match)</text>

        <rect x="100" width="80" height="22" rx="4" fill="#FCEFE6"/>
        <text x="108" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F16A21">#Agencies (95%)</text>

        <rect x="190" width="70" height="22" rx="4" fill="#FCEFE6"/>
        <text x="198" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F16A21">#SMM (91%)</text>

        <rect x="270" width="136" height="24" rx="6" fill="#F16A21"/>
        <text x="282" y="16" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFF">Apply To All Networks ➔</text>
      </g>
    </g>

    <!-- Bottom summary line -->
    <text x="40" y="340" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6B7280">⚡ 5,000 Free Credits Included with every Agency Plan</text>
  </g>
</svg>
