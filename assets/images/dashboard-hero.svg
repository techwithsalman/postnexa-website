    <g transform="translate(225, 85)">
      <!-- Calendar Controls -->
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#111827">October 2026</text>
      <rect x="140" y="0" width="60" height="24" rx="6" fill="#F3F4F6"/>
      <text x="152" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4B5563">Week</text>
