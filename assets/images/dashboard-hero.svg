        <text x="15" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280">MON 12</text>
        <text x="165" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280">TUE 13</text>
        <text x="315" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F16A21">WED 14 (Today)</text>
        <text x="465" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280">THU 15</text>
        <text x="615" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280">FRI 16</text>
      </g>

      <!-- Calendar Columns Grid -->
      <g transform="translate(0, 55)">
        <!-- Col 1 -->
        <rect x="0" y="0" width="140" height="380" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
        <!-- Post Card 1 -->
        <g transform="translate(8, 12)">
          <rect width="124" height="90" rx="6" fill="#FFF" stroke="#E5E7EB"/>
          <rect x="8" y="8" width="8" height="8" rx="2" fill="#1877F2"/>
          <text x="22" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#6B7280">09:00 AM • Published</text>
          <text x="8" y="32" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#111827">5 Tips to 10x ROI 🚀</text>
          <rect x="8" y="42" width="108" height="30" rx="4" fill="#F3F4F6"/>
          <text x="12" y="60" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">❤️ 4.2k  💬 382  🔄 129</text>
        </g>

        <!-- Col 2 -->
        <rect x="150" y="0" width="140" height="380" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
        <!-- Post Card 2 -->
        <g transform="translate(158, 12)">
          <rect width="124" height="105" rx="6" fill="#FFF" stroke="#E5E7EB"/>
          <rect x="8" y="8" width="8" height="8" rx="2" fill="#0A66C2"/>
          <text x="22" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#6B7280">02:15 PM • Scheduled</text>
          <text x="8" y="32" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#111827">Case Study: 300% Growth</text>
          <rect x="8" y="44" width="108" height="36" rx="4" fill="#0A66C2" opacity="0.1"/>
          <text x="14" y="66" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#0A66C2">📊 PDF Whitepaper</text>
          <rect x="8" y="85" width="60" height="14" rx="3" fill="#DEF7EC"/>
          <text x="12" y="95" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#03543F">Approved ✓</text>
        </g>

        <!-- Col 3: Active Day Today -->
        <rect x="300" y="0" width="140" height="380" rx="8" fill="#FFF9F5" stroke="#FBD5B5" stroke-width="1.5"/>
        <!-- Post Card 3 (Instagram Carousel with Preview) -->
        <g transform="translate(308, 12)">
          <rect width="124" height="140" rx="6" fill="#FFF" stroke="#F16A21" stroke-width="1.2"/>
          <rect x="8" y="8" width="8" height="8" rx="2" fill="#E1306C"/>
          <text x="22" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F16A21">10:30 AM • Queued</text>
          <text x="8" y="32" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#111827">Weekly Reel Drop 🎥</text>
          
          <!-- Image preview in post card -->
          <rect x="8" y="42" width="108" height="60" rx="4" fill="#FCEFE6"/>
          <circle cx="62" cy="72" r="14" fill="#F16A21"/>
          <polygon points="58,66 68,72 58,78" fill="#FFF"/>
          
          <rect x="8" y="110" width="70" height="18" rx="4" fill="#FEE2E2"/>
          <text x="12" y="122" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#991B1B">Pending Review</text>
        </g>

        <!-- Col 4 -->
        <rect x="450" y="0" width="140" height="380" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
        <!-- Post Card 4 -->
        <g transform="translate(458, 12)">
          <rect width="124" height="95" rx="6" fill="#FFF" stroke="#E5E7EB"/>
          <rect x="8" y="8" width="8" height="8" rx="2" fill="#000000"/>
          <text x="22" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#6B7280">06:00 PM • TikTok</text>
          <text x="8" y="32" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#111827">Behind the scenes 🎬</text>
          <rect x="8" y="44" width="108" height="28" rx="4" fill="#111827" opacity="0.06"/>
          <text x="12" y="62" font-family="system-ui, sans-serif" font-size="8" fill="#4B5563">#AgencyLife #Growth</text>
          <rect x="8" y="76" width="60" height="14" rx="3" fill="#DEF7EC"/>
          <text x="12" y="86" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#03543F">Approved ✓</text>
        </g>

        <!-- Col 5 -->
        <rect x="600" y="0" width="140" height="380" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
        <!-- Post Card 5 -->
        <g transform="translate(608, 12)">
          <rect width="124" height="85" rx="6" fill="#FFF" stroke="#E5E7EB"/>
          <rect x="8" y="8" width="8" height="8" rx="2" fill="#25D366"/>
          <text x="22" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#6B7280">11:00 AM • Broadcast</text>
          <text x="8" y="32" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#111827">VIP Product Launch</text>
          <text x="8" y="50" font-family="system-ui, sans-serif" font-size="8.5" fill="#6B7280">WhatsApp Newsletter</text>
          <rect x="8" y="62" width="65" height="16" rx="3" fill="#E0F2FE"/>
          <text x="12" y="74" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#0369A1">Auto-Queue</text>
        </g>
      </g>
    </g>

    <!-- Floating Live Stat Badge (Bottom Right) -->
    <g transform="translate(660, 480)" filter="url(#shadow-main)">
      <rect width="280" height="64" rx="12" fill="#212121"/>
      <circle cx="32" cy="32" r="16" fill="#10B981"/>
      <path d="M26 32L30 36L38 28" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="56" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">732 Posts Published Today</text>
      <text x="56" y="44" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#9CA3AF">Across 12 platforms • 0 errors</text>
    </g>
  </g>
</svg>
