<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none">
  <defs>
    <filter id="shadow-main" x="-20" y="-10" width="1040" height="640" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#1A1F36" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F16A21" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF9F5"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F16A21"/>
      <stop offset="100%" stop-color="#FFA84A"/>
    </linearGradient>
  </defs>

  <!-- Main Window Frame -->
  <g filter="url(#shadow-main)">
    <rect x="20" y="20" width="960" height="550" rx="16" fill="#FFFFFF"/>
    <rect x="20" y="20" width="960" height="550" rx="16" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- App Top Bar -->
    <path d="M20 36C20 27.1634 27.1634 20 36 20H964C972.837 20 980 27.1634 980 36V70H20V36Z" fill="url(#header-grad)"/>
    <line x1="20" y1="70" x2="980" y2="70" stroke="#EEF0F3" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="48" cy="45" r="5" fill="#FF5F56"/>
    <circle cx="64" cy="45" r="5" fill="#FFBD2E"/>
    <circle cx="80" cy="45" r="5" fill="#27C93F"/>

    <!-- Workspace Switcher Pill -->
    <rect x="110" y="32" width="180" height="26" rx="6" fill="#FFF" stroke="#E5E7EB"/>
    <circle cx="124" cy="45" r="6" fill="#F16A21"/>
    <text x="136" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#374151">Nexus Digital Agency</text>
    <path d="M276 43L280 47L284 43" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Top Navigation Tabs -->
    <rect x="330" y="33" width="70" height="24" rx="6" fill="#FFF4EE"/>
    <text x="345" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F16A21">Calendar</text>
    
    <text x="420" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Publisher</text>
    <text x="490" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Analytics</text>
    <text x="560" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Social Inbox</text>
    <text x="645" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Listening</text>

    <!-- Right Header Action -->
    <rect x="830" y="32" width="130" height="28" rx="8" fill="#F16A21"/>
    <text x="850" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFF">+ Create Post</text>
    <circle cx="800" cy="46" r="14" fill="#F3F4F6"/>
    <text x="794" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4B5563">AW</text>

    <!-- Sidebar Left -->
    <rect x="20" y="70" width="190" height="500" fill="#FAFBFC"/>
    <line x1="210" y1="70" x2="210" y2="570" stroke="#EEF0F3"/>

    <!-- Connected Accounts Filter -->
    <text x="36" y="100" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.5">ACCOUNTS (12/12)</text>
    
    <!-- Account List Items -->
    <g transform="translate(36, 115)">
      <!-- Item 1: Facebook -->
      <rect width="158" height="32" rx="6" fill="#FFF" stroke="#E5E7EB"/>
      <circle cx="16" cy="16" r="8" fill="#1877F2"/>
      <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F2937">Brand Global</text>
      <circle cx="144" cy="16" r="4" fill="#10B981"/>
    </g>

    <g transform="translate(36, 155)">
      <!-- Item 2: Instagram -->
      <rect width="158" height="32" rx="6" fill="#FFF4EE" stroke="#F16A21" stroke-width="1.2"/>
      <rect x="8" y="8" width="16" height="16" rx="4" fill="#E1306C"/>
      <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F16A21">@brand_hq</text>
      <circle cx="144" cy="16" r="4" fill="#F16A21"/>
    </g>

    <g transform="translate(36, 195)">
      <!-- Item 3: LinkedIn -->
      <rect width="158" height="32" rx="6" fill="#FFF" stroke="#E5E7EB"/>
      <rect x="8" y="8" width="16" height="16" rx="3" fill="#0A66C2"/>
      <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F2937">LinkedIn Page</text>
      <circle cx="144" cy="16" r="4" fill="#10B981"/>
    </g>

    <g transform="translate(36, 235)">
      <!-- Item 4: TikTok -->
      <rect width="158" height="32" rx="6" fill="#FFF" stroke="#E5E7EB"/>
      <rect x="8" y="8" width="16" height="16" rx="4" fill="#000000"/>
      <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F2937">TikTok Trends</text>
      <circle cx="144" cy="16" r="4" fill="#10B981"/>
    </g>

    <g transform="translate(36, 275)">
      <!-- Item 5: X / Twitter -->
      <rect width="158" height="32" rx="6" fill="#FFF" stroke="#E5E7EB"/>
      <rect x="8" y="8" width="16" height="16" rx="4" fill="#111827"/>
      <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F2937">@brand_news</text>
      <circle cx="144" cy="16" r="4" fill="#10B981"/>
    </g>

    <!-- AI Assistant Prompt Banner in Sidebar -->
    <g transform="translate(36, 335)">
      <rect width="158" height="120" rx="10" fill="#FFF8F3" stroke="#FBD5B5"/>
      <rect x="12" y="12" width="24" height="24" rx="6" fill="#F16A21"/>
      <text x="20" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFF">AI</text>
      <text x="44" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#212121">Champ AI Suite</text>
